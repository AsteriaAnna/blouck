<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>麦克风 / ASR 自检</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; font: 15px/1.6 system-ui, "Microsoft YaHei", sans-serif; background: #f6f1e7; color: #2d2a24; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 20px 60px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  .hint { color: #7b7162; margin: 0 0 20px; }
  .card { background: #fffdf8; border: 1px solid #e4dac8; border-radius: 14px; padding: 16px; margin: 14px 0; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button { border: 1px solid #c9b99e; background: #fff; color: #3a3329; border-radius: 10px; padding: 10px 16px; font: inherit; cursor: pointer; }
  button.primary { background: #b08d57; border-color: #b08d57; color: #fff; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 12px; font-size: 14px; }
  .kv b { color: #7b7162; font-weight: 500; }
  #partial { min-height: 52px; font-size: 20px; color: #2f5d50; white-space: pre-wrap; }
  #final { min-height: 40px; font-size: 18px; color: #6b4c2a; white-space: pre-wrap; }
  #status { color: #7b7162; }
  .err { color: #a33a2b; white-space: pre-wrap; }
  audio { width: 100%; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>麦克风 / ASR 自检</h1>
  <p class="hint">不经过图谱和 LLM，只把麦克风 PCM 直接发给 /ws/asr。回放“原始麦克风”用浏览器录音，回放“PCM WAV”用我们发给 ASR 的数据。</p>

  <div class="card">
    <div class="row">
      <button id="start" class="primary">开始录音</button>
      <button id="stop" disabled>停止并识别</button>
      <button id="play" disabled>回放原始麦克风</button>
      <button id="download" disabled>下载原始录音</button>
      <button id="download-wav" disabled>下载 PCM WAV</button>
    </div>
    <label style="display:flex;gap:8px;align-items:center;margin-top:10px;color:#7b7162;font-size:14px">
      <input type="checkbox" id="raw" /> 关闭回声消除 / 降噪 / 自动增益，测原始麦克风
    </label>
    <div class="kv" style="margin-top:12px">
      <b>麦克风</b><span id="device">-</span>
      <b>轨道参数</b><span id="settings">-</span>
      <b>AudioContext</b><span id="rate">-</span>
      <b>已发送</b><span id="sent">0 字节 / 0.0 秒</span>
      <b>状态</b><span id="status">待开始</span>
    </div>
  </div>

  <div class="card">
    <div class="kv"><b>实时 partial</b><div id="partial"></div></div>
    <div class="kv"><b>最终 final</b><div id="final"></div></div>
  </div>

  <div class="card">
    <div id="error" class="err"></div>
    <audio id="audio" controls></audio>
  </div>
</main>

<script>
const WORKLET = `
class PCMWorklet extends AudioWorkletProcessor {
  constructor(options) {
    super();
    this.inRate = (options.processorOptions && options.processorOptions.sampleRate) || 48000;
    this.outRate = 16000;
    this.ratio = this.inRate / this.outRate;
    this.carry = new Float32Array(0);
    this.pos = 0;
  }
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (!ch || !ch.length) return true;
    const merged = new Float32Array(this.carry.length + ch.length);
    merged.set(this.carry, 0);
    merged.set(ch, this.carry.length);
    const out = [];
    let pos = this.pos;
    while (pos + 1 < merged.length) {
      const i0 = Math.floor(pos);
      const frac = pos - i0;
      out.push(merged[i0] * (1 - frac) + merged[i0 + 1] * frac);
      pos += this.ratio;
    }
    const drop = Math.floor(pos);
    this.carry = merged.slice(drop);
    this.pos = pos - drop;
    if (out.length) {
      const pcm = new Int16Array(out.length);
      for (let i = 0; i < out.length; i++) {
        const s = Math.max(-1, Math.min(1, out[i]));
        pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
      }
      this.port.postMessage(pcm.buffer, [pcm.buffer]);
    }
    return true;
  }
}
registerProcessor('pcm-worklet', PCMWorklet);
`;

const $ = (id) => document.getElementById(id);
const b64 = (buf) => {
  const bytes = new Uint8Array(buf);
  let s = "";
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(s);
};

let ws = null, ctx = null, stream = null, node = null;
let chunks = [];
let sentBytes = 0;
let pcmPending = new Int16Array(0);
let recorder = null;
let recordedParts = [];
let originalUrl = "";

function setStatus(s) { $("status").textContent = s; }
function fail(e) {
  $("error").textContent = String((e && (e.stack || e.message)) || e);
  setStatus("出错");
}

function sendPcm(pcm) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: "audio", chunk: b64(pcm.buffer) }));
  sentBytes += pcm.byteLength;
  const sec = (sentBytes / 2 / 16000).toFixed(1);
  $("sent").textContent = sentBytes + " 字节 / " + sec + " 秒";
}

function pushPcm(pcm) {
  const merged = new Int16Array(pcmPending.length + pcm.length);
  merged.set(pcmPending, 0);
  merged.set(pcm, pcmPending.length);
  pcmPending = merged;
  while (pcmPending.length >= 1600) {
    const part = pcmPending.slice(0, 1600);
    pcmPending = pcmPending.slice(1600);
    chunks.push(part);
    sendPcm(part);
  }
}

function flushTail() {
  if (!pcmPending.length) return;
  const tail = pcmPending;
  pcmPending = new Int16Array(0);
  chunks.push(tail);
  sendPcm(tail);
}

function sendSilence(ms) {
  const n = Math.round((16000 * ms) / 1000);
  const pcm = new Int16Array(n);
  chunks.push(pcm);
  sendPcm(pcm);
}

function flush(pcm) {
  pushPcm(pcm);
}

async function start() {
  $("error").textContent = "";
  $("partial").textContent = "";
  $("final").textContent = "";
  chunks = []; sentBytes = 0; recordedParts = [];
  pcmPending = new Int16Array(0);
  if (originalUrl) URL.revokeObjectURL(originalUrl);
  originalUrl = "";
  $("sent").textContent = "0 字节 / 0.0 秒";
  $("start").disabled = true;
  setStatus("请求麦克风…");

  const raw = !!$("raw").checked;
  stream = await navigator.mediaDevices.getUserMedia({
    audio: {
      channelCount: 1,
      echoCancellation: !raw,
      noiseSuppression: !raw,
      autoGainControl: !raw,
    },
  });
  const track = stream.getAudioTracks()[0];
  $("device").textContent = (track && track.label) || "未知";
  try {
    const st = track.getSettings();
    $("settings").textContent = "sampleRate=" + (st.sampleRate || "?") + " channelCount=" + (st.channelCount || "?") + " echoCancellation=" + (st.echoCancellation || "?") + " noiseSuppression=" + (st.noiseSuppression || "?");
  } catch { $("settings").textContent = "-"; }

  try {
    const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus" : "";
    recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
    recorder.ondataavailable = (e) => { if (e.data && e.data.size) recordedParts.push(e.data); };
    recorder.onstop = () => {
      const blob = new Blob(recordedParts, { type: recorder.mimeType || "audio/webm" });
      originalUrl = URL.createObjectURL(blob);
      $("play").disabled = false;
      $("download").disabled = false;
    };
    recorder.start(100);
  } catch (e) {
    $("error").textContent = "MediaRecorder 不可用：" + e;
  }

  // 不强制 16k：用浏览器原生采样率，重采样放到 AudioWorklet 里
  ctx = new AudioContext();
  await ctx.resume();
  $("rate").textContent = ctx.sampleRate + " Hz, state=" + ctx.state;

  const blob = new Blob([WORKLET], { type: "application/javascript" });
  const url = URL.createObjectURL(blob);
  await ctx.audioWorklet.addModule(url);
  URL.revokeObjectURL(url);

  const source = ctx.createMediaStreamSource(stream);
  node = new AudioWorkletNode(ctx, "pcm-worklet", {
    processorOptions: { sampleRate: ctx.sampleRate },
  });
  node.port.onmessage = (ev) => flush(new Int16Array(ev.data));
  source.connect(node);

  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(proto + "://" + location.host + "/ws/asr");
  ws.onopen = () => {
    ws.send(JSON.stringify({ type: "start" }));
    setStatus("录音中… 自然停 1 秒再点停止");
    $("stop").disabled = false;
  };
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === "partial") $("partial").textContent = m.text;
    if (m.type === "segment") $("partial").textContent = m.text;
    if (m.type === "final") { $("final").textContent = m.text; setStatus("识别结束"); }
    if (m.type === "error") fail(m.message);
  };
  ws.onerror = () => fail("WebSocket 错误");
}

async function stop() {
  $("stop").disabled = true;
  setStatus("等待 final…");
  try { node && node.disconnect(); } catch {}
  try { if (recorder && recorder.state === "recording") recorder.stop(); } catch {}
  try { stream && stream.getTracks().forEach((t) => t.stop()); } catch {}
  try { ctx && await ctx.close(); } catch {}

  if (ws && ws.readyState === WebSocket.OPEN) {
    flushTail();
    sendSilence(300);
    setTimeout(() => {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "stop" }));
    }, 120);
    setTimeout(() => { setStatus("已停止（如果 final 为空，说明 ASR 没返回）"); ws.close(); }, 4000);
  }
  if (chunks.length) $("download-wav").disabled = false;
  setTimeout(() => {
    if (!originalUrl && recordedParts.length) {
      originalUrl = URL.createObjectURL(new Blob(recordedParts, { type: "audio/webm" }));
      $("play").disabled = false;
      $("download").disabled = false;
    }
  }, 500);
}

function wavBlob() {
  const total = chunks.reduce((a, c) => a + c.length, 0);
  const buf = new ArrayBuffer(44 + total * 2);
  const v = new DataView(buf);
  const writeStr = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  writeStr(0, "RIFF"); v.setUint32(4, 36 + total * 2, true); writeStr(8, "WAVE");
  writeStr(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, 16000, true); v.setUint32(28, 32000, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  writeStr(36, "data"); v.setUint32(40, total * 2, true);
  let off = 44;
  for (const c of chunks) { for (let i = 0; i < c.length; i++) { v.setInt16(off, c[i], true); off += 2; } }
  return new Blob([buf], { type: "audio/wav" });
}

function play() {
  if (!originalUrl) { playPcmWav(); return; }
  $("audio").src = originalUrl;
  $("audio").play().catch(fail);
}
function playPcmWav() {
  $("audio").src = URL.createObjectURL(wavBlob());
  $("audio").play().catch(fail);
}
function download() {
  if (!originalUrl) return;
  const a = document.createElement("a");
  a.href = originalUrl;
  a.download = "mic-original.webm";
  a.click();
}
function downloadWav() {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(wavBlob());
  a.download = "mic-pcm.wav";
  a.click();
}

$("start").onclick = () => start().catch(fail);
$("stop").onclick = () => stop().catch(fail);
$("play").onclick = play;
$("download").onclick = download;
$("download-wav").onclick = downloadWav;
</script>
</body>
</html>
